xterm:
    candy:
        description: |
            xterm classic X terminal emulator
            Installs xterm, the reference X terminal emulator (usable under
            XWayland). Verifiable: the xterm binary lands at /usr/bin/xterm and
            the xterm package is installed.
        distro:
            arch:
                package:
                    - xterm
            fedora:
                package:
                    - xterm
        plan:
            - check: the xterm binary is installed at /usr/bin/xterm
              file:
                file: /usr/bin/xterm
                exists: true
            - check: the xterm package is registered with the package manager
              package:
                package: xterm
                installed: true

xterm-skill:
    skill:
        name: xterm
        family: selkies
        owner: xterm
        description: |-
            Lightweight X11 terminal emulator (xterm) that triggers on-demand XWayland on labwc/selkies-desktop, enabling X11 automation tools (xdotool, xprop, xwininfo) to find windows.
            Use when working with xterm, on-demand XWayland startup, or X11-based window automation on a Wayland desktop.
